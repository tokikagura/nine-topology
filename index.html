<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nine Topology v2.2c</title>
<style>
  body { background-color: #0b0c10; color: #c5c6c7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 8px; display: flex; flex-direction: column; align-items: center; touch-action: manipulation; overflow-x: hidden; }
  h1 { font-size: 1.1rem; color: #66fcf1; text-shadow: 0 0 8px rgba(102,252,241,0.5); margin: 4px 0; text-align: center; }
  #status-panel { width: 100%; max-width: 340px; background: rgba(31, 40, 51, 0.8); border: 1px solid #45f3ff; border-radius: 6px; padding: 6px; margin-bottom: 6px; box-sizing: border-box; font-size: 0.75rem; }
  .flex-row { display: flex; justify-content: space-between; margin-bottom: 2px; }
  #board-container { position: relative; width: 324px; height: 324px; background: #1f2833; border: 3px solid #66fcf1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 4px; padding: 4px; box-sizing: border-box; border-radius: 6px; overflow: visible; }
  .block { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 1px; background: #0b0c10; border-radius: 2px; position: relative; border: 2px solid transparent; box-sizing: border-box; transition: border-color 0.2s, box-shadow 0.2s; overflow: visible; }
  .cell { background: #1f2833; display: flex; align-items: center; justify-content: center; position: relative; height: 32px; width: 32px; }
  .stone { width: 82%; height: 82%; border-radius: 50%; }
  .stone.white { background: radial-gradient(circle, #ffffff 30%, #a3bac3 90%); box-shadow: 0 0 8px #ffffff; }
  .stone.black { background: radial-gradient(circle, #4b5d67 10%, #000000 90%); box-shadow: 0 0 8px #000000; border: 1px solid #333; }
  .stone.blue { background: radial-gradient(circle, #00d2ff 30%, #0044ff 90%); box-shadow: 0 0 10px #00d2ff; border-radius: 50%; }
  .stone.blue-reserved { width: 70%; height: 70%; border: 2px dashed #00d2ff; border-radius: 50%; background: rgba(0, 210, 255, 0.15); box-shadow: inset 0 0 6px #00d2ff; }
  #control-panel { width: 100%; max-width: 340px; margin-top: 6px; background: rgba(31, 40, 51, 0.8); border: 1px solid #45f3ff; border-radius: 6px; padding: 6px; box-sizing: border-box; text-align: center; font-size: 0.8rem; }
  button { background: linear-gradient(135deg, #66fcf1, #45f3ff); border: none; color: #0b0c10; padding: 6px 10px; font-weight: bold; border-radius: 4px; margin: 2px; cursor: pointer; font-size: 0.75rem; }
  #log-panel { width: 100%; max-width: 340px; height: 80px; overflow-y: auto; background: #000; border: 1px solid #45f3ff; border-radius: 4px; margin-top: 4px; padding: 4px; box-sizing: border-box; font-family: monospace; font-size: 0.65rem; color: #66fcf1; text-align: left; }
</style>
</head>
<body>
<h1>NINE TOPOLOGY v2.2c</h1>
<div id="status-panel">
  <div class="flex-row"><span><b>手番:</b> <span id="current-player" style="color:#66fcf1;">先手 (白)</span></span><span><b>ターン:</b> <span id="turn-count" style="color:#66fcf1;">1</span></span></div>
  <div class="flex-row"><span><b>白(自分):</b> <span id="score-p1" style="color:#fff;">0</span></span><span><b>黒(Grok):</b> <span id="score-p2" style="color:#a3bac3;">0</span></span></div>
  <div class="flex-row" style="border-top:1px dashed #45f3ff; margin-top:3px; padding-top:3px;">
    <span><b>対戦通算:</b> <span id="match-stats" style="color:#ff9900;">0勝 0敗</span></span>
    <span id="season-info" style="color:#00d2ff;">青石: 5T降臨</span>
  </div>
</div>
<div id="board-container"></div>
<div id="control-panel">
  <div id="export-zone" style="display:flex; justify-content:center; flex-wrap:wrap; gap:2px;">
    <button id="btn-toggle-bot" onclick="toggleGrokBattle()" style="background: linear-gradient(135deg, #ff9900, #ff5500); color: #fff;">対局テスト開始</button>
    <button id="btn-generate-gif" onclick="generateHighlightGIF()" style="background: linear-gradient(135deg, #00d2ff, #0044ff); color: #fff;">10秒ショートGIF抽出</button>
  </div>
</div>
<div id="log-panel"></div>
<canvas id="video-canvas" width="324" height="324" style="display:none;"></canvas>

<script>
  /* === Grok思考ロジック === */
  function evaluateGrokMove(boardData, myColor, seasonInfo) {
    const {reservedPos: rp, isDropped, bonusMultiplier: mul} = seasonInfo;
    let best = null, max = -1e9;
    for(let r=0;r<9;r++) for(let c=0;c<9;c++){
      if(boardData[r][c]) continue;
      if(!isDropped && r===rp.b && c===rp.c) continue;
      let s = mul * 10 / (1+Math.abs(r-rp.b)+Math.abs(c-rp.c));
      if(s>max){ max=s; best={b:r,c:c}; }
    }
    return {place: best||{b:4,c:4}, slide: null};
  }

  let board = Array.from({length: 9}, () => Array(9).fill(null));
  let currentPlayer = 'white';
  let gamePhase = 'setup';
  let setupCount = 0;
  let turnNumber = 1;
  let blueStoneDropped = false;
  let reservedPos = { b: 2, c: 4 }; 
  let boardSnapshots = [];
  let winSnapshots = []; 

  let stats = { wins: 0, losses: 0 };
  let battleInterval = null;

  const CORNER_BLOCKS = [0, 2, 6, 8];

  window.onload = function() { initGame(); };

  function initGame() {
    board = Array.from({length: 9}, () => Array(9).fill(null));
    currentPlayer = 'white';
    gamePhase = 'setup';
    setupCount = 0;
    turnNumber = 1;
    blueStoneDropped = false;
    reservedPos = { b: 2, c: 4 };
    board[reservedPos.b][reservedPos.c] = 'blue-reserved';
    boardSnapshots = [];
    saveBoardSnapshot();
    renderBoard();
  }

  function saveBoardSnapshot() {
    boardSnapshots.push({ turn: turnNumber, board: board.map(arr => [...arr]) });
  }

  function logMessage(msg) {
    const logPanel = document.getElementById('log-panel');
    if (!logPanel) return;
    logPanel.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}<br>`;
    logPanel.scrollTop = logPanel.scrollHeight;
  }

  function checkBlueStoneDrop() {
    if (!blueStoneDropped && turnNumber === 5 && gamePhase === 'place') {
      board[reservedPos.b][reservedPos.c] = 'blue';
      blueStoneDropped = true;
      logMessage("【環境イベント】青石が降臨しました。");
    }
  }

  function calculateScores() {
    let white = 0, black = 0;
    const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    for(let b=0;b<9;b++){
      lines.forEach(l => {
        const s1=board[b][l[0]], s2=board[b][l[1]], s3=board[b][l[2]];
        if(s1 && s1===s2 && s2===s3){
          const hasBlue = (s1==='blue'||s2==='blue'||s3==='blue');
          const pts = hasBlue ? 2 : 1;
          if(s1==='white') white += pts; 
          if(s1==='black') black += pts;
        }
      });
    }
    return { white, black };
  }

  function renderBoard() {
    const container = document.getElementById('board-container');
    container.innerHTML = '';
    for (let b = 0; b < 9; b++) {
      const blockEl = document.createElement('div');
      blockEl.className = 'block';
      for (let c = 0; c < 9; c++) {
        const cellEl = document.createElement('div');
        cellEl.className = 'cell';
        const stoneType = board[b][c];
        if (stoneType) {
          const stoneEl = document.createElement('div');
          stoneEl.className = `stone ${stoneType}`;
          cellEl.appendChild(stoneEl);
        }
        blockEl.appendChild(cellEl);
      }
      container.appendChild(blockEl);
    }
    
    const scores = calculateScores();
    document.getElementById('current-player').innerText = currentPlayer === 'white' ? '先手 (白)' : '後手 (黒Grok)';
    document.getElementById('turn-count').innerText = turnNumber;
    document.getElementById('score-p1').innerText = scores.white;
    document.getElementById('score-p2').innerText = scores.black;
    document.getElementById('match-stats').innerText = `${stats.wins}勝 ${stats.losses}敗`;
  }

  function toggleGrokBattle() {
    if (battleInterval) {
      clearInterval(battleInterval);
      battleInterval = null;
      document.getElementById('btn-toggle-bot').innerText = "対局テスト開始";
      logMessage("対戦テストを一時停止しました。");
    } else {
      document.getElementById('btn-toggle-bot').innerText = "対局テスト中 (停止)";
      logMessage("【v2.2c 起動】対局テストシミュレーションを実行中...");
      battleInterval = setInterval(stepBattle, 40);
    }
  }

  function stepBattle() {
    if (gamePhase === 'setup') {
      const valid = [];
      for (let b of CORNER_BLOCKS) {
        for (let c = 0; c < 9; c++) {
          if (board[b][c] === null && !board[b].includes(currentPlayer)) valid.push({b,c});
        }
      }
      if (valid.length > 0) {
        const choice = valid[Math.floor(Math.random() * valid.length)];
        board[choice.b][choice.c] = currentPlayer;
        setupCount++;
        if (setupCount === 4) gamePhase = 'place';
        currentPlayer = currentPlayer === 'white' ? 'black' : 'white';
        renderBoard();
      }
      return;
    }

    if (gamePhase === 'place') {
      checkBlueStoneDrop();

      let target = null;
      if (currentPlayer === 'black') {
        const seasonInfo = {
          dropTurn: 5, currentTurn: turnNumber, isDropped: blueStoneDropped,
          reservedPos: reservedPos, bonusMultiplier: 2.0
        };
        const grokRes = evaluateGrokMove(board, 'black', seasonInfo);
        target = grokRes ? grokRes.place : null;
      } else {
        const valid = [];
        for(let b=0;b<9;b++) for(let c=0;c<9;c++) {
          if(board[b][c] === null) valid.push({b,c});
        }
        if (valid.length > 0) target = valid[Math.floor(Math.random() * valid.length)];
      }

      if (target && board[target.b][target.c] === null) {
        board[target.b][target.c] = currentPlayer;
        saveBoardSnapshot();

        let empties = 0;
        for(let b=0;b<9;b++) for(let c=0;c<9;c++) if(!board[b][c]) empties++;

        if (empties === 0) {
          const scores = calculateScores();
          if (scores.white > scores.black) {
            stats.wins++;
            logMessage(`[対局終了] 先手(白)の勝利。 (白:${scores.white} vs 黒:${scores.black})`);
            winSnapshots = [...boardSnapshots]; // 勝利時のアセットを内部保持
            clearInterval(battleInterval);
            battleInterval = null;
            document.getElementById('btn-toggle-bot').innerText = "対局テスト開始";
            renderBoard();
          } else {
            stats.losses++;
            logMessage(`[対局終了] 後手(黒)の勝利。 (白:${scores.white} vs 黒:${scores.black}) -> 再試行`);
            initGame();
          }
          return;
        }

        turnNumber++;
        currentPlayer = currentPlayer === 'white' ? 'black' : 'white';
        renderBoard();
      }
    }
  }

  function generateHighlightGIF() {
    const targetData = winSnapshots.length > 0 ? winSnapshots : boardSnapshots;
    if (targetData.length < 2) {
      logMessage("GIF抽出用のデータが足りません。");
      return;
    }

    logMessage("【GIF抽出】ハイライトアニメーションを出力中...");
    const canvas = document.getElementById('video-canvas');
    const ctx = canvas.getContext('2d');
    const stream = canvas.captureStream(30);

    let options = { mimeType: 'image/gif' };
    if (!MediaRecorder.isTypeSupported('image/gif')) options = { mimeType: 'video/webm' };

    const mediaRecorder = new MediaRecorder(stream, options);
    const chunks = [];
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const blob = new Blob(chunks, { type: 'image/gif' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `NineTopology_Highlight.gif`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      logMessage("【抽出完了】GIFファイルのダウンロードが完了しました。");
    };

    mediaRecorder.start();
    const startIdx = Math.max(0, targetData.length - 12);
    const slice = targetData.slice(startIdx);
    let frame = 0;
    const interval = setInterval(() => {
      if (frame >= slice.length) {
        clearInterval(interval);
        setTimeout(() => mediaRecorder.stop(), 500);
        return;
      }
      drawBoardToCanvas(ctx, slice[frame].board);
      frame++;
    }, 700);
  }

  function drawBoardToCanvas(ctx, boardData) {
    ctx.fillStyle = "#1f2833"; ctx.fillRect(0, 0, 324, 324);
    ctx.strokeStyle = "#66fcf1"; ctx.lineWidth = 3; ctx.strokeRect(0, 0, 324, 324);
    for (let b = 0; b < 9; b++) {
      const bx = (b % 3) * 108 + 4, by = Math.floor(b / 3) * 108 + 4;
      ctx.fillStyle = "#0b0c10"; ctx.fillRect(bx, by, 100, 100);
      for (let c = 0; c < 9; c++) {
        const cx = bx + (c % 3) * 33 + 1, cy = by + Math.floor(c / 3) * 33 + 1;
        ctx.fillStyle = "#1f2833"; ctx.fillRect(cx, cy, 32, 32);
        const stone = boardData[b][c];
        if (stone) {
          ctx.beginPath(); ctx.arc(cx + 16, cy + 16, 13, 0, Math.PI * 2);
          if (stone === 'white') ctx.fillStyle = "#ffffff";
          else if (stone === 'black') ctx.fillStyle = "#4b5d67";
          else if (stone === 'blue') ctx.fillStyle = "#00d2ff";
          ctx.fill();
        }
      }
    }
  }
</script>
</body>
</html>
