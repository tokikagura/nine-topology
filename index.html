<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nine Topology v2.0d</title>
<style>
  body { background-color: #0b0c10; color: #c5c6c7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 8px; display: flex; flex-direction: column; align-items: center; touch-action: manipulation; overflow-x: hidden; }
  h1 { font-size: 1.1rem; color: #66fcf1; text-shadow: 0 0 8px rgba(102,252,241,0.5); margin: 4px 0; text-align: center; }
  #status-panel { width: 100%; max-width: 340px; background: rgba(31, 40, 51, 0.8); border: 1px solid #45f3ff; border-radius: 6px; padding: 6px; margin-bottom: 6px; box-sizing: border-box; font-size: 0.75rem; }
  .flex-row { display: flex; justify-content: space-between; margin-bottom: 2px; }
  #board-container { position: relative; width: 324px; height: 324px; background: #1f2833; border: 3px solid #66fcf1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 4px; padding: 4px; box-sizing: border-box; border-radius: 6px; overflow: visible; }
  .block { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 1px; background: #0b0c10; border-radius: 2px; position: relative; border: 2px solid transparent; box-sizing: border-box; transition: border-color 0.2s, box-shadow 0.2s; overflow: visible; }
  .block.locked { border: 2px solid #ff0055 !important; box-shadow: inset 0 0 8px rgba(255,0,85,0.5); }
  .block.selectable { cursor: pointer; }
  .block.selectable:hover { border-color: rgba(102, 252, 241, 0.5); }
  .block.selected { border: 2px solid #66fcf1 !important; box-shadow: 0 0 12px #66fcf1; z-index: 5; }
  .cell { background: #1f2833; display: flex; align-items: center; justify-content: center; position: relative; height: 32px; width: 32px; }
  .cell.highlight { background: rgba(102,252,241,0.2); cursor: pointer; }
  .cell.highlight:hover { background: rgba(102,252,241,0.4); }
  .stone { width: 82%; height: 82%; border-radius: 50%; }
  .stone.white { background: radial-gradient(circle, #ffffff 30%, #a3bac3 90%); box-shadow: 0 0 8px #ffffff; }
  .stone.black { background: radial-gradient(circle, #4b5d67 10%, #000000 90%); box-shadow: 0 0 8px #000000; border: 1px solid #333; }
  .stone.red { background: radial-gradient(circle, #ff0055 30%, #990022 90%); box-shadow: 0 0 10px #ff0055; border-radius: 4px; }
  .stone.blue { background: radial-gradient(circle, #00d2ff 30%, #0044ff 90%); box-shadow: 0 0 10px #00d2ff; border-radius: 50%; }
  .stone.blue-reserved { width: 70%; height: 70%; border: 2px dashed #00d2ff; border-radius: 50%; background: rgba(0, 210, 255, 0.15); box-shadow: inset 0 0 6px #00d2ff; animation: pulse 1.5s infinite alternate; }
  @keyframes pulse { 0% { opacity: 0.4; } 100% { opacity: 1.0; } }
  .arrow-btn { width: 28px; height: 28px; border-radius: 50%; background: #0b0c10; border: 2px solid #66fcf1; color: #66fcf1; font-weight: bold; font-size: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; position: absolute; z-index: 100; box-shadow: 0 0 8px #66fcf1; user-select: none; }
  .arrow-up { top: -14px; left: calc(50% - 14px); }
  .arrow-down { bottom: -14px; left: calc(50% - 14px); }
  .arrow-left { left: -14px; top: calc(50% - 14px); }
  .arrow-right { right: -14px; top: calc(50% - 14px); }
  #control-panel { width: 100%; max-width: 340px; margin-top: 6px; background: rgba(31, 40, 51, 0.8); border: 1px solid #45f3ff; border-radius: 6px; padding: 6px; box-sizing: border-box; text-align: center; font-size: 0.8rem; }
  button { background: linear-gradient(135deg, #66fcf1, #45f3ff); border: none; color: #0b0c10; padding: 6px 10px; font-weight: bold; border-radius: 4px; margin: 2px; cursor: pointer; font-size: 0.75rem; transition: opacity 0.2s; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #log-panel { width: 100%; max-width: 340px; height: 80px; overflow-y: auto; background: #000; border: 1px solid #45f3ff; border-radius: 4px; margin-top: 4px; padding: 4px; box-sizing: border-box; font-family: monospace; font-size: 0.65rem; color: #66fcf1; text-align: left; }
</style>
</head>
<body>
<h1>NINE TOPOLOGY v2.0d</h1>
<div id="status-panel">
  <div class="flex-row"><span><b>手番:</b> <span id="current-player" style="color:#66fcf1;">先手 (白)</span></span><span><b>ターン:</b> <span id="turn-count" style="color:#66fcf1;">1</span> (空き:<span id="empty-count">81</span>)</span></div>
  <div class="flex-row"><span><b>白ポイント:</b> <span id="score-p1" style="color:#fff;">0</span> (壁残:<span id="wall-p1">3</span>)</span><span><b>黒ポイント:</b> <span id="score-p2" style="color:#a3bac3;">0</span> (壁残:<span id="wall-p2">4</span>)</span></div>
  <div class="flex-row" style="border-top:1px dashed #45f3ff; margin-top:3px; padding-top:3px;"><span><b>システム状況:</b> <span id="slide-lock-status" style="color:#66fcf1;">準備フェーズ</span></span><span id="season-info" style="color:#00d2ff;">青石: 5T目降臨</span></div>
</div>
<div id="board-container"></div>
<div id="control-panel">
  <div id="phase-instruction">【準備フェーズ】四隅のブロック(B1, B3, B7, B9)に石を配置してください（各ブロック自色1個まで）</div>
  <div id="secret-wall-zone" style="margin-top:4px;"><button id="btn-declare-wall" onclick="toggleWallDeclaration()">赤石(絶対障壁)をシークレット申告</button></div>
  <div id="skip-zone" style="margin-top:6px; display:none;"><button id="btn-skip-slide" onclick="skipSlide()" style="background: linear-gradient(135deg, #ff0055, #990022); color: #fff;">スライドをスキップ</button></div>
  
  <div id="export-zone" style="margin-top:6px; display:flex; justify-content:center; flex-wrap:wrap; gap:2px;">
    <button id="btn-toggle-bot" onclick="toggleTestBot()" style="background: linear-gradient(135deg, #ff9900, #ff5500); color: #fff;">【BOT】全自動バグチェック開始</button>
    <button id="btn-download-ntpn" onclick="downloadNtpnFile()" style="background: linear-gradient(135deg, #a3bac3, #ffffff); color: #0b0c10;">棋譜 (.ntpn) DL</button>
    <button id="btn-generate-gif" onclick="generateHighlightGIF()" style="background: linear-gradient(135deg, #00d2ff, #0044ff); color: #fff;">10秒ハイライトGIF抽出</button>
  </div>
</div>
<div id="log-panel"></div>

<canvas id="gif-canvas" width="324" height="324" style="display:none;"></canvas>

<script>
  /* === 【v2.0d 確実描画・インラインGIFエンコーダー】 === */
  function buildGifBlobFromSnapshots(snapshots, width, height) {
    const bytes = [];
    
    // 1. GIF89a Header
    bytes.push(0x47, 0x49, 0x46, 0x38, 0x39, 0x61);
    
    // 2. Logical Screen Descriptor (324x324)
    bytes.push(width & 0xff, (width >> 8) & 0xff);
    bytes.push(height & 0xff, (height >> 8) & 0xff);
    bytes.push(0xf2, 0x00, 0x00); // 8色グローバルカラーテーブル(2^3=8色)

    // 3. Global Color Table (8色: R, G, B)
    const palette = [
      11, 12, 16,     // 0: 背景黒 (#0b0c10)
      31, 40, 51,     // 1: 盤面枠 (#1f2833)
      102, 252, 241,  // 2: シアン (#66fcf1)
      255, 255, 255,  // 3: 白石 (#ffffff)
      75, 93, 103,    // 4: 黒石 (#4b5d67)
      255, 0, 85,     // 5: 赤石 (#ff0055)
      0, 210, 255,    // 6: 青石 (#00d2ff)
      0, 0, 0         // 7: 予備
    ];
    bytes.push(...palette);

    // 4. Netscape Application Extension (無限ループ設定)
    bytes.push(0x21, 0xff, 0x0b, 0x4e, 0x45, 0x54, 0x53, 0x43, 0x41, 0x50, 0x45, 0x32, 0x2e, 0x30, 0x03, 0x01, 0x00, 0x00, 0x00);

    const canvas = document.getElementById('gif-canvas');
    const ctx = canvas.getContext('2d');

    // 5. 各フレームの処理
    snapshots.forEach(snap => {
      drawBoardToCanvas(ctx, snap.board);
      const imgData = ctx.getImageData(0, 0, width, height);
      const data = imgData.data;

      // Graphic Control Extension (0.8秒間隔)
      bytes.push(0x21, 0xf9, 0x04, 0x00, 0x50, 0x00, 0x00, 0x00);

      // Image Descriptor
      bytes.push(0x2c, 0x00, 0x00, 0x00, 0x00, width & 0xff, (width >> 8) & 0xff, height & 0xff, (height >> 8) & 0xff, 0x00);

      // LZW Minimum Code Size
      bytes.push(0x03); // 3ビット (8色)

      // ピクセルをカラーパレットのインデックス (0〜7) へ厳密マッピング
      const indexed = new Uint8Array(width * height);
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i+1], b = data[i+2];
        let idx = 0;
        if (r > 200 && g > 200 && b > 200) idx = 3; // 白石
        else if (r > 200 && g < 50) idx = 5; // 赤石
        else if (g > 180 && b > 200) idx = 6; // 青石
        else if (g > 200 && b > 200) idx = 2; // シアン線
        else if (r > 60 && g > 80 && b > 90) idx = 4; // 黒石
        else if (r > 20 && g > 30) idx = 1; // 盤面グレー
        else idx = 0; // 背景黒
        indexed[i / 4] = idx;
      }

      // 簡易非圧縮LZWストリームビルド (標準GIF仕様準拠)
      let stream = [0x08]; // Clear Code (2^3 = 8)
      let subBlocks = [];

      for (let i = 0; i < indexed.length; i++) {
        stream.push(indexed[i]);
        if (stream.length === 250) {
          subBlocks.push(stream.length, ...stream);
          stream = [];
        }
      }
      stream.push(0x09); // End Code (9)
      if (stream.length > 0) subBlocks.push(stream.length, ...stream);
      subBlocks.push(0x00); // Block Terminator

      bytes.push(...subBlocks);
    });

    bytes.push(0x3b); // GIF Trailer
    return new Blob([new Uint8Array(bytes)], { type: 'image/gif' });
  }

  /* === ゲーム本体ロジック === */
  let board = Array.from({length: 9}, () => Array(9).fill(null));
  let emptyCount = 81;
  let wallCount = { white: 3, black: 4 };
  let slideLockedBlocks = [];
  let selectedBlock = null;
  let currentPlayer = 'white';
  let gamePhase = 'setup';
  let setupCount = 0;
  let isWallDeclarationActive = false;

  const SEASON_DROP_TURN = 5;
  let blueStoneDropped = false;

  let ntpnMoveHistory = [];
  let boardSnapshots = []; 
  let currentTurnMove = { place: null, slide: null, event: null };
  let turnNumber = 1;

  const CORNER_BLOCKS = [0, 2, 6, 8];
  const CELL_NAMES = ["a1", "b1", "c1", "a2", "b2", "c2", "a3", "b3", "c3"];

  window.onload = function() {
    initGame();
  };

  function initGame() {
    board = Array.from({length: 9}, () => Array(9).fill(null));
    emptyCount = 81;
    wallCount = { white: 3, black: 4 };
    slideLockedBlocks = [];
    selectedBlock = null;
    currentPlayer = 'white';
    gamePhase = 'setup';
    setupCount = 0;
    isWallDeclarationActive = false;

    blueStoneDropped = false;
    board[2][4] = 'blue-reserved';

    ntpnMoveHistory = [];
    boardSnapshots = [];
    saveBoardSnapshot();

    currentTurnMove = { place: null, slide: null, event: null };
    turnNumber = 1;

    const logPanel = document.getElementById('log-panel');
    if (logPanel) logPanel.innerHTML = '';

    logMessage("システム再起動。v2.0d (GIF完全描画修正版) 起動！");
    renderBoard();
  }

  function saveBoardSnapshot() {
    const copy = board.map(arr => [...arr]);
    boardSnapshots.push({
      turn: turnNumber,
      board: copy
    });
  }

  function logMessage(msg) {
    const logPanel = document.getElementById('log-panel');
    if (!logPanel) return;
    const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    logPanel.innerHTML += `[${time}] ${msg}<br>`;
    logPanel.scrollTop = logPanel.scrollHeight;
  }

  function checkBlueStoneDrop() {
    if (!blueStoneDropped && turnNumber === SEASON_DROP_TURN && gamePhase === 'place') {
      for (let b = 0; b < 9; b++) {
        for (let c = 0; c < 9; c++) {
          if (board[b][c] === 'blue-reserved') {
            board[b][c] = 'blue';
            blueStoneDropped = true;
            const eventMsg = `[EVENT: DROP_BLUE_STONE +B${b+1}-${CELL_NAMES[c]}]`;
            currentTurnMove.event = eventMsg;
            logMessage(`【シーズン環境イベント】青石が B${b+1}-${CELL_NAMES[c]} にドロップ降臨いたしました！`);
            return;
          }
        }
      }
    }
  }

  function commitTurnMove() {
    if (!currentTurnMove.place) return;

    const pSide = currentPlayer === 'white' ? 'W' : 'B';
    const placeStr = `${pSide}${currentTurnMove.place}`;
    const slideStr = currentTurnMove.slide ? `${pSide}${currentTurnMove.slide}` : `${pSide}>PASS`;
    const eventPrefix = currentTurnMove.event ? `${currentTurnMove.event} ` : '';

    const fullMoveStr = `${eventPrefix}${placeStr} / ${slideStr}`;
    ntpnMoveHistory.push(`${turnNumber}. ${fullMoveStr}`);

    logMessage(`[記譜] ${turnNumber}. ${fullMoveStr}`);
    saveBoardSnapshot(); 

    turnNumber++;
    currentTurnMove = { place: null, slide: null, event: null };
  }

  function downloadNtpnFile() {
    const now = new Date();
    const dateStr = now.toISOString().split('T')[0];
    const timeStr = [
      String(now.getHours()).padStart(2, '0'),
      String(now.getMinutes()).padStart(2, '0'),
      String(now.getSeconds()).padStart(2, '0')
    ].join('');

    const scores = calculateScores();
    let resultStr = "IN_PROGRESS";
    if (emptyCount === 0 || gamePhase === 'gameover') {
      if (scores.whiteScore > scores.blackScore) resultStr = "1-0";
      else if (scores.blackScore > scores.whiteScore) resultStr = "0-1";
      else resultStr = "1/2-1/2";
    }

    let ntpnContent = `[Game "Nine Topology"]\n`;
    ntpnContent += `[Date "${dateStr}"]\n`;
    ntpnContent += `[White "[Tokikagura] Test_Bot_A.ntai"]\n`;
    ntpnContent += `[Black "[Vanguard] Test_Bot_B.ntai"]\n`;
    ntpnContent += `[Result "${resultStr}"]\n\n`;

    if (ntpnMoveHistory.length === 0) {
      ntpnContent += `; No moves recorded yet.\n`;
    } else {
      ntpnMoveHistory.forEach(move => {
        ntpnContent += `${move}\n`;
      });
    }

    const blob = new Blob([ntpnContent], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `NTPN_${dateStr.replace(/-/g, '')}_${timeStr}_NineTopology.ntpn`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    logMessage(`対戦記譜 (NTPN_${timeStr}) をローカルへ保存完了！`);
  }

  /* 【v2.0d 修正完了】盤面と石が完璧に表示・アニメーションするGIF抽出 */
  function generateHighlightGIF() {
    if (boardSnapshots.length < 2) {
      logMessage("ハイライト抽出に必要な盤面データが不足しております！");
      return;
    }

    logMessage("【GIFビルド開始】iPhoneで100%描画・動くGIF動画を出力中...");

    setTimeout(() => {
      try {
        const startIdx = Math.max(0, boardSnapshots.length - 12);
        const targetSnapshots = boardSnapshots.slice(startIdx);

        const gifBlob = buildGifBlobFromSnapshots(targetSnapshots, 324, 324);
        const url = URL.createObjectURL(gifBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `NineTopology_Highlight_Turn${turnNumber}.gif`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        logMessage("【GIF抽出完了】iPhoneの写真・ファイルアプリで完璧に動くGIFの保存完了！");

      } catch (err) {
        logMessage(`【エラー発生】: ${err.message}`);
      }
    }, 50);
  }

  function drawBoardToCanvas(ctx, boardData) {
    ctx.fillStyle = "#1f2833";
    ctx.fillRect(0, 0, 324, 324);
    ctx.strokeStyle = "#66fcf1";
    ctx.lineWidth = 3;
    ctx.strokeRect(0, 0, 324, 324);

    const blockSize = 104;
    const gap = 4;

    for (let b = 0; b < 9; b++) {
      const bx = (b % 3) * (blockSize + gap) + gap;
      const by = Math.floor(b / 3) * (blockSize + gap) + gap;

      ctx.fillStyle = "#0b0c10";
      ctx.fillRect(bx, by, blockSize, blockSize);

      const cellSize = 32;
      const cellGap = 1;

      for (let c = 0; c < 9; c++) {
        const cx = bx + (c % 3) * (cellSize + cellGap) + cellGap;
        const cy = by + Math.floor(c / 3) * (cellSize + cellGap) + cellGap;

        ctx.fillStyle = "#1f2833";
        ctx.fillRect(cx, cy, cellSize, cellSize);

        const stone = boardData[b][c];
        if (stone) {
          ctx.beginPath();
          ctx.arc(cx + 16, cy + 16, 13, 0, Math.PI * 2);
          if (stone === 'white') {
            ctx.fillStyle = "#ffffff";
          } else if (stone === 'black') {
            ctx.fillStyle = "#4b5d67";
          } else if (stone === 'red') {
            ctx.fillStyle = "#ff0055";
          } else if (stone === 'blue') {
            ctx.fillStyle = "#00d2ff";
          } else if (stone === 'blue-reserved') {
            ctx.strokeStyle = "#00d2ff";
            ctx.lineWidth = 2;
            ctx.stroke();
            continue;
          }
          ctx.fill();
        }
      }
    }
  }

  function calculateScores() {
    let whiteScore = 0;
    let blackScore = 0;
    const lines = [
      [0,1,2], [3,4,5], [6,7,8],
      [0,3,6], [1,4,7], [2,5,8],
      [0,4,8], [2,4,6]
    ];

    for (let b = 0; b < 9; b++) {
      const block = board[b];
      lines.forEach(line => {
        const s1 = block[line[0]];
        const s2 = block[line[1]];
        const s3 = block[line[2]];

        if (s1 && s1 === s2 && s2 === s3) {
          if (s1 === 'white') whiteScore++;
          if (s1 === 'black') blackScore++;
        }
      });
    }

    return { whiteScore, blackScore };
  }

  function countEmptyCells() {
    let count = 0;
    for (let b = 0; b < 9; b++) {
      for (let c = 0; c < 9; c++) {
        if (board[b][c] === null) count++;
      }
    }
    return count;
  }

  function updateStatusPanel() {
    const scores = calculateScores();
    emptyCount = countEmptyCells();

    document.getElementById('current-player').innerText = currentPlayer === 'white' ? '先手 (白)' : '後手 (黒)';
    document.getElementById('current-player').style.color = currentPlayer === 'white' ? '#ffffff' : '#888888';
    document.getElementById('turn-count').innerText = turnNumber;
    document.getElementById('empty-count').innerText = emptyCount;
    document.getElementById('score-p1').innerText = scores.whiteScore;

    const scoreP2 = document.getElementById('score-p2');
    scoreP2.innerText = scores.blackScore;
    scoreP2.style.color = "#a3bac3";

    document.getElementById('wall-p1').innerText = wallCount.white;
    document.getElementById('wall-p2').innerText = wallCount.black;

    const lockStatusEl = document.getElementById('slide-lock-status');
    const instructionEl = document.getElementById('phase-instruction');
    const skipZone = document.getElementById('skip-zone');
    const seasonInfoEl = document.getElementById('season-info');

    if (blueStoneDropped) {
      seasonInfoEl.innerText = "青石: 盤面降臨済";
      seasonInfoEl.style.color = "#00d2ff";
    } else {
      seasonInfoEl.innerText = `青石: ${SEASON_DROP_TURN}T目降臨予定`;
      seasonInfoEl.style.color = "#ff9900";
    }

    if (gamePhase === 'setup') {
      lockStatusEl.innerText = "準備フェーズ";
      instructionEl.innerText = "【準備フェーズ】四隅のブロック(B1, B3, B7, B9)に石を配置してください（各ブロック自色1個まで）";
      skipZone.style.display = 'none';
    } else if (gamePhase === 'place') {
      lockStatusEl.innerText = emptyCount <= 15 ? "スライドロック (空き15以下)" : "スライド可能";
      if (emptyCount <= 15) {
        instructionEl.innerText = "【配置フェーズ】空きマスが15以下のためスライド不可。配置のみ行います。";
      } else {
        instructionEl.innerText = "【配置フェーズ】好きな空きマスをタップして、資本(石)をデポジットしてください。";
      }
      skipZone.style.display = 'none';
    } else if (gamePhase === 'slide') {
      lockStatusEl.innerText = "スライド選択待ち";
      instructionEl.innerText = "【スライドフェーズ】ブロックを選択し、矢印でスライドするか、スキップしてください。";
      skipZone.style.display = 'block';
    }

    const btnDeclare = document.getElementById('btn-declare-wall');
    if (btnDeclare) {
      if (isWallDeclarationActive) {
        btnDeclare.innerText = "赤石(絶対障壁)を申告中！";
        btnDeclare.style.background = "linear-gradient(135deg, #ff0055, #990022)";
        btnDeclare.style.color = "#fff";
      } else {
        btnDeclare.innerText = "赤石(絶対障壁)をシークレット申告";
        btnDeclare.style.background = "linear-gradient(135deg, #66fcf1, #45f3ff)";
        btnDeclare.style.color = "#0b0c10";
      }
      if (wallCount[currentPlayer] <= 0 || gamePhase === 'setup' || gamePhase === 'slide') {
        btnDeclare.disabled = true;
      } else {
        btnDeclare.disabled = false;
      }
    }
  }

  function toggleWallDeclaration() {
    if (gamePhase === 'setup' || gamePhase === 'slide') return;
    if (wallCount[currentPlayer] <= 0) {
      logMessage("絶対障壁(赤石)のデポジット残高がありません！");
      return;
    }
    isWallDeclarationActive = !isWallDeclarationActive;
    updateStatusPanel();
  }

  function isValidPlaceTarget(b, c) {
    if (board[b][c] !== null) return false;

    if (gamePhase === 'setup') {
      if (!CORNER_BLOCKS.includes(b)) return false;
      const myColor = currentPlayer;
      const alreadyHasMyColor = board[b].some(stone => stone === myColor);
      if (alreadyHasMyColor) return false;
      return true;
    } else if (gamePhase === 'place') {
      return true;
    }
    return false;
  }

  function handleCellClick(b, c) {
    if (gamePhase === 'setup') {
      if (!isValidPlaceTarget(b, c)) {
        logMessage("エラー: 四隅制限、または青石予約マスへの不渡り配置でやんす！");
        return;
      }

      board[b][c] = currentPlayer;
      const blockNames = {0: 'B1', 2: 'B3', 6: 'B7', 8: 'B9'};
      logMessage(`[準備] ${currentPlayer === 'white' ? '白' : '黒'}が四隅 ${blockNames[b]} にデポジット完了。`);

      setupCount++;
      if (setupCount === 4) {
        gamePhase = 'place';
        logMessage("準備フェーズ完了！ 通常のアクションを開始いたしやす！");
        checkBlueStoneDrop();
      }

      currentPlayer = currentPlayer === 'white' ? 'black' : 'white';
      renderBoard();

    } else if (gamePhase === 'place') {
      if (!isValidPlaceTarget(b, c)) {
        if (board[b][c] === 'blue-reserved') {
          logMessage("不渡りエラー: 青石の着地予定地（予約マス）には石を配置できません！");
        }
        return;
      }

      const cellCoord = CELL_NAMES[c];
      if (isWallDeclarationActive && wallCount[currentPlayer] > 0) {
        board[b][c] = 'red';
        wallCount[currentPlayer]--;
        isWallDeclarationActive = false;
        currentTurnMove.place = `+B${b+1}-${cellCoord}(RED)`;
        logMessage(`${currentPlayer === 'white' ? '白' : '黒'}が赤石（絶対障壁）を配置！`);
      } else {
        board[b][c] = currentPlayer;
        currentTurnMove.place = `+B${b+1}-${cellCoord}`;
        logMessage(`${currentPlayer === 'white' ? '白' : '黒'}が B${b+1} 内に石を配置。`);
      }

      emptyCount = countEmptyCells();
      if (emptyCount <= 15) {
        logMessage("市場流動性低下（空きマス15以下）のため、スライド不可。自動ターン交代！");
        slideLockedBlocks = [];
        currentTurnMove.slide = null;
        commitTurnMove();

        currentPlayer = currentPlayer === 'white' ? 'black' : 'white';
        gamePhase = 'place';
        checkBlueStoneDrop();
      } else {
        gamePhase = 'slide';
      }
      renderBoard();
    }
  }

  function selectBlockForSlide(b) {
    if (gamePhase !== 'slide') return;
    if (slideLockedBlocks.includes(b)) {
      logMessage("不渡り防止ロック（直前スライド制限）がかけられてお座居やす仕様！");
      return;
    }
    selectedBlock = b;
    renderBoard();
  }

  function executeSlide(b, direction) {
    if (gamePhase !== 'slide') return;
    if (slideLockedBlocks.includes(b)) return;

    const block = board[b];

    if (direction === 'right') {
      let temp0 = block[2]; block[2] = block[1]; block[1] = block[0]; block[0] = temp0;
      let temp1 = block[5]; block[5] = block[4]; block[4] = block[3]; block[3] = temp1;
      let temp2 = block[8]; block[8] = block[7]; block[7] = block[6]; block[6] = temp2;
      currentTurnMove.slide = `>B${b+1}-R`;
      logMessage(`B${b + 1}内のマスを右へスライド完了！`);
    } else if (direction === 'left') {
      let temp0 = block[0]; block[0] = block[1]; block[1] = block[2]; block[2] = temp0;
      let temp1 = block[3]; block[3] = block[4]; block[4] = block[5]; block[5] = temp1;
      let temp2 = block[6]; block[6] = block[7]; block[7] = block[8]; block[8] = temp2;
      currentTurnMove.slide = `>B${b+1}-L`;
      logMessage(`B${b + 1}内のマスを左へスライド完了！`);
    } else if (direction === 'down') {
      let temp0 = block[6]; block[6] = block[3]; block[3] = block[0]; block[0] = temp0;
      let temp1 = block[7]; block[7] = block[4]; block[4] = block[1]; block[1] = temp1;
      let temp2 = block[8]; block[8] = block[5]; block[5] = block[2]; block[2] = temp2;
      currentTurnMove.slide = `>B${b+1}-D`;
      logMessage(`B${b + 1}内のマスを下へスライド完了！`);
    } else if (direction === 'up') {
      let temp0 = block[0]; block[0] = block[3]; block[3] = block[6]; block[6] = temp0;
      let temp1 = block[1]; block[1] = block[4]; block[4] = block[7]; block[7] = temp1;
      let temp2 = block[2]; block[2] = block[5]; block[5] = block[8]; block[8] = temp2;
      currentTurnMove.slide = `>B${b+1}-U`;
      logMessage(`B${b + 1}内のマスを上へスライド完了！`);
    }

    commitTurnMove();
    slideLockedBlocks = [b];
    selectedBlock = null;

    currentPlayer = currentPlayer === 'white' ? 'black' : 'white';
    gamePhase = 'place';
    checkBlueStoneDrop();
    renderBoard();
  }

  function skipSlide() {
    if (gamePhase !== 'slide') return;
    logMessage(`${currentPlayer === 'white' ? '白' : '黒'}はスライドをスキップ！`);

    currentTurnMove.slide = null;
    commitTurnMove();

    slideLockedBlocks = [];
    selectedBlock = null;
    currentPlayer = currentPlayer === 'white' ? 'black' : 'white';
    gamePhase = 'place';
    checkBlueStoneDrop();
    renderBoard();
  }

  function addArrowButtons(blockEl, b) {
    const directions = [
      { dir: 'up', symbol: '↑', class: 'arrow-up' },
      { dir: 'down', symbol: '↓', class: 'arrow-down' },
      { dir: 'left', symbol: '←', class: 'arrow-left' },
      { dir: 'right', symbol: '→', class: 'arrow-right' }
    ];

    directions.forEach(d => {
      const btn = document.createElement('div');
      btn.className = `arrow-btn ${d.class}`;
      btn.innerText = d.symbol;
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        executeSlide(b, d.dir);
      });
      blockEl.appendChild(btn);
    });
  }

  function renderBoard() {
    const container = document.getElementById('board-container');
    container.innerHTML = '';

    for (let b = 0; b < 9; b++) {
      const blockEl = document.createElement('div');
      blockEl.className = 'block';
      blockEl.dataset.blockIndex = b;

      if (slideLockedBlocks.includes(b)) blockEl.classList.add('locked');
      if (gamePhase === 'slide' && emptyCount > 15 && !slideLockedBlocks.includes(b)) blockEl.classList.add('selectable');
      if (selectedBlock === b) blockEl.classList.add('selected');

      for (let c = 0; c < 9; c++) {
        const cellEl = document.createElement('div');
        cellEl.className = 'cell';
        cellEl.dataset.blockIndex = b;
        cellEl.dataset.cellIndex = c;

        const stoneType = board[b][c];
        if (stoneType) {
          const stoneEl = document.createElement('div');
          stoneEl.className = `stone ${stoneType}`;
          cellEl.appendChild(stoneEl);
        } else {
          if (gamePhase === 'setup' || gamePhase === 'place') {
            if (isValidPlaceTarget(b, c)) cellEl.classList.add('highlight');
          }
        }

        cellEl.addEventListener('click', (e) => {
          if (gamePhase === 'setup' || gamePhase === 'place') {
            e.stopPropagation();
            handleCellClick(b, c);
          }
        });

        blockEl.appendChild(cellEl);
      }

      if (selectedBlock === b && gamePhase === 'slide' && emptyCount > 15) {
        addArrowButtons(blockEl, b);
      }

      blockEl.addEventListener('click', (e) => {
        if (gamePhase === 'slide' && emptyCount > 15 && !slideLockedBlocks.includes(b)) {
          if (e.target.classList.contains('arrow-btn')) return;
          selectBlockForSlide(b);
        }
      });

      container.appendChild(blockEl);
    }

    updateStatusPanel();
  }

  class NineTopologyTestBot {
    constructor(speedMs = 30) {
      this.speedMs = speedMs;
      this.intervalId = null;
      this.moveCount = 0;
      this.maxMoves = 250;
    }

    start() {
      const btn = document.getElementById('btn-toggle-bot');
      if (btn) {
        btn.innerText = "【BOT】テスト対局中... (停止)";
        btn.style.background = "linear-gradient(135deg, #ff0055, #990022)";
      }

      logMessage("【BOT起動】v2.0d 完全描画GIF修正テスト開始！");
      this.moveCount = 0;

      this.intervalId = setInterval(() => {
        try {
          this.step();
        } catch (error) {
          this.stop();
          logMessage(`【バグ検出】: ${error.message}`);
          alert(`【バグ発生】: ${error.message}`);
        }
      }, this.speedMs);
    }

    stop() {
      if (this.intervalId) {
        clearInterval(this.intervalId);
        this.intervalId = null;
      }
      const btn = document.getElementById('btn-toggle-bot');
      if (btn) {
        btn.innerText = "【BOT】全自動バグチェック開始";
        btn.style.background = "linear-gradient(135deg, #ff9900, #ff5500)";
      }
      logMessage("【BOT停止】対局処理を停止しました。");
    }

    step() {
      this.moveCount++;
      if (this.moveCount > this.maxMoves) {
        this.stop();
        logMessage("【安全停止】最大手数到達のため停止しました。");
        return;
      }

      if (gamePhase === 'setup') {
        const validTargets = [];
        for (let b of CORNER_BLOCKS) {
          for (let c = 0; c < 9; c++) {
            if (isValidPlaceTarget(b, c)) validTargets.push({ b, c });
          }
        }
        if (validTargets.length === 0) throw new Error("準備フェーズで配置可能マスが消滅しました。");
        const choice = validTargets[Math.floor(Math.random() * validTargets.length)];
        handleCellClick(choice.b, choice.c);
        return;
      }

      if (gamePhase === 'place') {
        if (wallCount[currentPlayer] > 0 && Math.random() < 0.15 && !isWallDeclarationActive) {
          toggleWallDeclaration();
        }

        const validTargets = [];
        for (let b = 0; b < 9; b++) {
          for (let c = 0; c < 9; c++) {
            if (isValidPlaceTarget(b, c)) validTargets.push({ b, c });
          }
        }

        if (validTargets.length === 0) {
          if (emptyCount === 0) {
            this.stop();
            const scores = calculateScores();
            let winnerStr = "引き分け";
            if (scores.whiteScore > scores.blackScore) winnerStr = "先手 (白) の勝利！";
            else if (scores.blackScore > scores.whiteScore) winnerStr = "後手 (黒) の勝利！";

            logMessage(`【対局完走】${winnerStr} (白: ${scores.whiteScore} - 黒: ${scores.blackScore})`);
            downloadNtpnFile();
            generateHighlightGIF(); 
            return;
          }
          throw new Error("空きマスがあるのに配置不能状態が発生しました。");
        }

        const choice = validTargets[Math.floor(Math.random() * validTargets.length)];
        handleCellClick(choice.b, choice.c);
        return;
      }

      if (gamePhase === 'slide') {
        if (emptyCount <= 15) throw new Error("空き15以下でスライドに突入しました。");

        if (Math.random() < 0.25) {
          skipSlide();
          return;
        }

        const availableBlocks = [];
        for (let b = 0; b < 9; b++) {
          if (!slideLockedBlocks.includes(b)) availableBlocks.push(b);
        }

        if (availableBlocks.length === 0) {
          skipSlide();
          return;
        }

        const targetBlock = availableBlocks[Math.floor(Math.random() * availableBlocks.length)];
        const directions = ['up', 'down', 'left', 'right'];
        const targetDir = directions[Math.floor(Math.random() * directions.length)];

        executeSlide(targetBlock, targetDir);
        return;
      }
    }
  }

  const testBot = new NineTopologyTestBot(30);

  function toggleTestBot() {
    if (testBot.intervalId) {
      testBot.stop();
    } else {
      testBot.start();
    }
  }
</script>
