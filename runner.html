<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nine Topology NTAI 対戦ポータル v3.0</title>
<style>
  body { background: #0b0c10; color: #c5c6c7; font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 8px; display: flex; flex-direction: column; align-items: center; }
  h1 { font-size: 1rem; color: #66fcf1; margin: 4px 0; text-align: center; }
  #iframe-container { border: 2px solid #45f3ff; border-radius: 8px; overflow: hidden; width: 330px; height: 520px; background: #000; box-shadow: 0 0 10px rgba(102,252,241,0.2); }
  iframe { width: 100%; height: 100%; border: none; }
  
  #ntai-panel { width: 330px; margin-top: 8px; background: rgba(31, 40, 51, 0.9); padding: 8px; border-radius: 6px; box-sizing: border-box; border: 1px solid #45f3ff; font-size: 0.75rem; }
  .section-title { font-weight: bold; color: #66fcf1; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
  
  .ai-slot { border: 1px solid #45f3ff; border-radius: 4px; padding: 6px; margin-bottom: 6px; background: rgba(0,0,0,0.3); }
  .slot-label { font-weight: bold; font-size: 0.7rem; margin-bottom: 4px; display: block; }
  .slot-label.white { color: #ffffff; }
  .slot-label.black { color: #ff0055; }

  textarea { width: 100%; height: 45px; background: #000; color: #66fcf1; border: 1px solid #45f3ff; border-radius: 4px; font-family: monospace; font-size: 0.6rem; box-sizing: border-box; resize: vertical; margin-top: 4px; }
  
  button { background: linear-gradient(135deg, #66fcf1, #45f3ff); border: none; color: #0b0c10; font-weight: bold; padding: 8px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 0.8rem; margin-top: 4px; }
  button:active { opacity: 0.8; }
  
  .file-btn { background: #1f2833; color: #66fcf1; border: 1px solid #45f3ff; padding: 4px 8px; border-radius: 4px; font-size: 0.65rem; cursor: pointer; display: inline-block; }
  #status-info { margin-top: 6px; padding: 4px; background: #000; border-radius: 4px; color: #00d2ff; font-family: monospace; font-size: 0.65rem; word-break: break-all; }
</style>
</head>
<body>

<h1>NTAI シーズン対戦ポータル v3.0</h1>

<!-- ゲーム本体（index.html）枠 -->
<div id="iframe-container">
  <iframe id="game-frame" src="index.html"></iframe>
</div>

<!-- 外部AI読み込み制御パネル -->
<div id="ntai-panel">
  <div class="section-title"><span>🤖 独立AI対戦スロット (.ntai)</span></div>
  
  <!-- ① 先手（白）スロット -->
  <div class="ai-slot">
    <span class="slot-label white">⚪ 先手 (White) AI:</span>
    <label class="file-btn" onclick="triggerInput('file-white')">📁 ファイル選択</label>
    <input type="file" id="file-white" style="display:none;" onchange="handleFile(event, 'white')">
    <textarea id="code-white" placeholder="// 先手AIのコードを貼り付け"></textarea>
  </div>

  <!-- ② 後手（黒）スロット -->
  <div class="ai-slot">
    <span class="slot-label black">🔴 後手 (Black) AI:</span>
    <label class="file-btn" onclick="triggerInput('file-black')">📁 ファイル選択</label>
    <input type="file" id="file-black" style="display:none;" onchange="handleFile(event, 'black')">
    <textarea id="code-black" placeholder="// 後手AIのコードを貼り付け"></textarea>
  </div>

  <button onclick="startDuel()">両AIをセットして対局開始</button>
  
  <div id="status-info">⚪ 未セット | 🔴 未セット</div>
</div>

<script>
  let loadedCodeWhite = "";
  let loadedCodeBlack = "";

  function triggerInput(id) {
    const el = document.getElementById(id);
    el.value = '';
    el.click();
  }

  function handleFile(event, side) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      if (side === 'white') {
        loadedCodeWhite = e.target.result;
        document.getElementById('code-white').value = loadedCodeWhite;
      } else {
        loadedCodeBlack = e.target.result;
        document.getElementById('code-black').value = loadedCodeBlack;
      }
    };
    reader.readAsText(file);
  }

  function startDuel() {
    const codeW = document.getElementById('code-white').value.trim() || loadedCodeWhite;
    const codeB = document.getElementById('code-black').value.trim() || loadedCodeBlack;

    if (!codeW && !codeB) {
      alert("⚠️ 少なくともどちらか一方のAIコードを入力してください。");
      return;
    }

    const iframe = document.getElementById('game-frame');
    try {
      const iframeWin = iframe.contentWindow;

      // ゲーム盤面初期化
      if (typeof iframeWin.initGame === 'function') {
        iframeWin.initGame();
      }

      // 古いスクリプトを削除
      const oldW = iframeWin.document.getElementById('ntai-script-white');
      const oldB = iframeWin.document.getElementById('ntai-script-black');
      if (oldW) oldW.remove();
      if (oldB) oldB.remove();

      // 先手AIの注入 (window.NTAI_Engine_White に登録)
      if (codeW) {
        const scriptW = iframeWin.document.createElement('script');
        scriptW.id = 'ntai-script-white';
        scriptW.textContent = `
          (function(){
            ${codeW}
            if (window.NTAI_Engine) {
              window.NTAI_Engine_White = window.NTAI_Engine;
              window.NTAI_Engine = null; // グローバル汚染防止
            }
          })();
        `;
        iframeWin.document.body.appendChild(scriptW);
      }

      // 後手AIの注入 (window.NTAI_Engine_Black に登録)
      if (codeB) {
        const scriptB = iframeWin.document.createElement('script');
        scriptB.id = 'ntai-script-black';
        scriptB.textContent = `
          (function(){
            ${codeB}
            if (window.NTAI_Engine) {
              window.NTAI_Engine_Black = window.NTAI_Engine;
              window.NTAI_Engine = null; // グローバル汚染防止
            }
          })();
        `;
        iframeWin.document.body.appendChild(scriptB);
      }

      // ステータス表示の更新
      setTimeout(() => {
        const engineW = iframeWin.NTAI_Engine_White;
        const engineB = iframeWin.NTAI_Engine_Black;
        
        const nameW = engineW ? engineW.name : 'デフォルト';
        const nameB = engineB ? engineB.name : 'デフォルト';

        document.getElementById('status-info').innerHTML = `⚪先手: <b>${nameW}</b><br>🔴後手: <b>${nameB}</b>`;
        alert(`⚔️ 対局スタート！\n⚪ 先手: ${nameW}\n🔴 後手: ${nameB}`);
      }, 100);

    } catch (e) {
      alert("❌ AIのセットアップに失敗しました: " + e.message);
    }
  }
</script>

</body>
</html>
