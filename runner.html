<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nine Topology NTAI 対戦ポータル</title>
<style>
  body { background: #0b0c10; color: #c5c6c7; font-family: sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
  h1 { font-size: 1rem; color: #66fcf1; margin: 4px 0; }
  #iframe-container { border: 2px solid #45f3ff; border-radius: 8px; overflow: hidden; width: 340px; height: 560px; background: #000; }
  iframe { width: 100%; height: 100%; border: none; }
  #ntai-panel { width: 340px; margin-top: 10px; background: #1f2833; padding: 8px; border-radius: 6px; box-sizing: border-box; border: 1px solid #45f3ff; }
  textarea { width: 100%; height: 80px; background: #000; color: #66fcf1; border: 1px solid #45f3ff; font-family: monospace; font-size: 0.7rem; box-sizing: border-box; resize: vertical; }
  button { background: linear-gradient(135deg, #66fcf1, #45f3ff); border: none; color: #0b0c10; font-weight: bold; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-top: 4px; width: 100%; font-size: 0.8rem; }
  .info { font-size: 0.7rem; color: #a3bac3; margin-bottom: 4px; }
</style>
</head>
<body>

<h1>NTAI (Nine Topology AI) 外部対戦ポータル</h1>

<!-- ゲーム本体（index.html）を読み込む枠 -->
<div id="iframe-container">
  <iframe id="game-frame" src="index.html"></iframe>
</div>

<!-- 外部AI読み込み枠 -->
<div id="ntai-panel">
  <div class="info">外部AIコード (.ntai / JS) を貼り付けて登録してください:</div>
  <textarea id="ai-code-input" placeholder="// 外部AIが生成した window.NTAI_Engine のコードをここに貼り付け"></textarea>
  <button onclick="injectExternalAI()">外部AIを読み込んで対戦開始</button>
</div>

<script>
function injectExternalAI() {
  const code = document.getElementById('ai-code-input').value;
  const iframe = document.getElementById('game-frame');
  
  if (!code.trim()) {
    alert("AIコードを入力してください。");
    return;
  }

  try {
    // iframe内のWindowに外部AIのスクリプトを注入
    const script = iframe.contentWindow.document.createElement('script');
    script.textContent = code + `\n
      console.log("NTAI Engine Loaded:", window.NTAI_Engine ? window.NTAI_Engine.name : "Failed");
      if (window.NTAI_Engine) {
        alert("NTAI: " + window.NTAI_Engine.name + " (" + window.NTAI_Engine.author + ") の登録に成功しました！");
      }
    `;
    iframe.contentWindow.document.body.appendChild(script);
  } catch (e) {
    alert("AIコードの読み込みに失敗しました: " + e.message);
  }
}
</script>

</body>
</html>
